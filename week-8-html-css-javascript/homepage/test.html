<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" /> -->
        <link href="styles.css" rel="stylesheet">
        <script src="script.js" defer></script>
        <title>Persona - Know your personality!</title>
    </head>
    <body>
        <section id="header">
            <a href="index.html">Persona</a>

            <div>
                <ul id="navbar">
                    <li><a href="index.html">Home</a></li>
                    <li><a class="active" href="test.html">Personality Test</a></li>
                    <li><a href="types.html">Personality Types</a></li>
                    <li><a href="about.html">About</a></li>
                    <img id="close" src="img/close.png" alt="close_icon">
                </ul>
            </div>
            <div id="mobile">
                <img id="bar" src="img/menu.png" alt="menu_icon">
            </div>
        </section>


        <section id="test">
            <form id="testForm">
                <div id="questions">
                    <h5 class="question">What's you ideal reading spot?</h5>
                    <div class="options">
                        <span>
                            <input type="radio" id="option11" name="q1" value="3">
                            <label for="option11">In a cozy cafe</label>
                        </span>
                        <span>
                            <input type="radio" id="option21" name="q1" value="5">
                            <label for="option21">In a dimly lit library</label>
                        </span>
                        <span>
                            <input type="radio" id="option31" name="q1" value="1">
                            <label for="option31">In a garden surrounded by flowers</label>
                        </span>
                        <span>
                            <input type="radio" id="option41" name="q1" value="10">
                            <label for="option41">Under a tree in the woods</label>
                        </span>
                    </div>

                    <h5 class="question">What's your favorite to listen to?</h5>
                    <div class="options">
                        <span>
                            <input type="radio" id="option12" name="q2" value="3">
                            <label for="option12">Classical music</label>
                        </span>
                        <span>
                            <input type="radio" id="option22" name="q2" value="1">
                            <label for="option22">K-pop</label>
                        </span>
                        <span>
                            <input type="radio" id="option32" name="q2" value="5">
                            <label for="option32">Science podcasts</label>
                        </span>
                        <span>
                            <input type="radio" id="option42" name="q2" value="10">
                            <label for="option42">Anything that you like</label>
                        </span>
                    </div>

                    <h5 class="question">Where you do want to go for a vacation?</h5>
                    <div class="options">
                        <span>
                            <input type="radio" id="option13" name="q3" value="5">
                            <label for="option13">Historical places</label>
                        </span>
                        <span>
                            <input type="radio" id="option23" name="q3" value="3">
                            <label for="option23">Hiking mountains</label>
                        </span>
                        <span>
                            <input type="radio" id="option33" name="q3" value="1">
                            <label for="option33">Vibrant beaches</label>
                        </span>
                        <span>
                            <input type="radio" id="option43" name="q3" value="10">
                            <label for="option43">Grand resorts</label>
                        </span>
                    </div>

                    <h5 class="question">Which kind of weather you enjoy the most?</h5>
                    <div class="options">
                        <span>
                            <input type="radio" id="option14" name="q4" value="10">
                            <label for="option14">Dark and cloudy</label>
                        </span>
                        <span>
                            <input type="radio" id="option24" name="q4" value="1">
                            <label for="option24">Rainy and gloomy</label>
                        </span>
                        <span>
                            <input type="radio" id="option34" name="q4" value="3">
                            <label for="option34">Sunny and warm</label>
                        </span>
                        <span>
                            <input type="radio" id="option44" name="q4" value="5">
                            <label for="option44">Misty and cool</label>
                        </span>
                    </div>

                    <h5 class="question">Choose a pet companion</h5>
                    <div class="options">
                        <span>
                            <input type="radio" id="option15" name="q5" value="10">
                            <label for="option15">Kitten</label>
                        </span>
                        <span>
                            <input type="radio" id="option25" name="q5" value="1">
                            <label for="option25">Puppy</label>
                        </span>
                        <span>
                            <input type="radio" id="option35" name="q5" value="3">
                            <label for="option35">Fishes</label>
                        </span>
                        <span>
                            <input type="radio" id="option45" name="q5" value="5">
                            <label for="option45">Parrot</label>
                        </span>
                    </div>
                    <div class="text-center my-5">
                        <button class="btn btn-lg px-5 py-3" id="submitTest">
                            Check my personality type!
                        </button>
                    </div>
                </div>
            </form>

            <div id="result" class="text-center">
                <h2 id="resultTitle"></h2>
                <p id="resultDesc"></p>
                <button class="btn btn-lg px-5 py-3" id="retakeTest">
                    Retake the test
                </button>
            </div>
        </section>

    </body>
</html>
